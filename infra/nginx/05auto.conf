# /etc/nginx/sites-available/05auto.conf
# Скопируйте на VDS и включите: ln -s /etc/nginx/sites-available/05auto.conf /etc/nginx/sites-enabled/
# Сертификаты: certbot --nginx -d 05auto.ru -d www.05auto.ru

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# Редирект с HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name 05auto.ru www.05auto.ru;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# Редирект с www на голый домен
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.05auto.ru;
    ssl_certificate /etc/letsencrypt/live/05auto.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/05auto.ru/privkey.pem;
    return 301 https://05auto.ru$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name 05auto.ru;

    ssl_certificate /etc/letsencrypt/live/05auto.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/05auto.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Безопасность
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; script-src 'self' 'unsafe-inline' 'unsafe-eval'; frame-src https://yandex.ru https://*.yandex.ru https://vk.com https://*.vk.com https://*.vkvideo.ru; connect-src 'self' https:;" always;

    # Сжатие
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    # brotli — если собран ngx_brotli
    # brotli on; brotli_types text/plain text/css application/json application/javascript image/svg+xml;

    limit_conn conn_limit 50;
    client_max_body_size 12M;

    # Загруженные файлы напрямую с диска (минуя Node)
    location /uploads/ {
        alias /var/lib/05auto/uploads/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # API
    location /api/ {
        limit_req zone=api_limit burst=40 nodelay;
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Статика Next (кэшируем агрессивно)
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Всё остальное — Next.js
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
