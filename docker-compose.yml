# Dev-окружение: только Postgres + Redis.
# Web и API запускайте локально через `pnpm dev` для hot-reload.

services:
  postgres:
    image: postgres:16-alpine
    container_name: 05auto-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zonaremonta}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zonaremonta}
      POSTGRES_DB: ${POSTGRES_DB:-zonaremonta}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-zonaremonta}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: 05auto-redis-dev
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
