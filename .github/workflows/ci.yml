name: Site checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check
      - name: Check hosting and native browser price forms
        run: |
          npm install --prefix "$RUNNER_TEMP/zr-price-browser" --no-save --no-package-lock --ignore-scripts playwright-core@1.55.0
          export ZR_TEST_PLAYWRIGHT="$RUNNER_TEMP/zr-price-browser/node_modules/playwright-core"
          export CHROME_BIN="$(command -v google-chrome)"
          npm run check:hosting -- --browser
